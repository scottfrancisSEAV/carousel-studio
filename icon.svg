  <rect x="24" y="12" width="26" height="34" rx="4" fill="#ffffff" opacity="0.28" transform="rotate(6 37 29)"/>
  <rect x="18" y="11" width="27" height="36" rx="4" fill="#ffffff" opacity="0.55" transform="rotate(3 31 29)"/>
  <rect x="12" y="10" width="28" height="38" rx="4" fill="#ffffff"/>
  <rect x="17" y="17" width="12" height="4" rx="2" fill="#f48b1a"/>
  <rect x="17" y="25" width="18" height="3" rx="1.5" fill="#17223b"/>
  <rect x="17" y="31" width="14" height="3" rx="1.5" fill="#17223b" opacity="0.55"/>
  <rect x="17" y="39" width="10" height="4" rx="2" fill="#f48b1a"/>
  <circle cx="49" cy="52" r="6" fill="#f48b1a"/>
</svg>
